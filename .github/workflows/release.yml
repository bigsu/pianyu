name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore Pianyu.sln

      - name: Check formatting
        run: dotnet format Pianyu.sln --verify-no-changes --no-restore

      - name: Build
        run: dotnet build Pianyu.sln -c Release --no-restore

      - name: Test
        run: dotnet test Pianyu.sln -c Release --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/test-results.trx'
          if-no-files-found: ignore

  publish:
    name: Publish win-x64
    needs: verify
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish single-file executable
        shell: pwsh
        run: >-
          dotnet publish src/Pianyu.App/Pianyu.App.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None
          -p:DebugSymbols=false
          -o artifacts/release

      - name: Normalize release filename
        shell: pwsh
        run: Copy-Item "artifacts/release/片语.exe" "artifacts/release/pianyu.exe"

      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: pianyu-win-x64
          path: artifacts/release/pianyu.exe
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$env:GITHUB_REF_NAME"
          "artifacts/release/pianyu.exe"
          --title "片语 $env:GITHUB_REF_NAME"
          --generate-notes
